# A tag (vX.Y.Z or vX.Y.Z-rc.N) publishes recipe360.mcpb as that release's file, the address the MCP Registry
# points to, with a signed build-provenance attestation (since 0.1.0-rc.23): anyone can check that the file was
# published by this repository's workflow, from the tagged commit, with
#   gh attestation verify recipe360.mcpb --repo sebastianarangouribe-coder/recipe360-mcp
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write          # the attestation: a short-lived signing certificate (Sigstore)
  attestations: write      # the attestation: kept with the repository
  artifact-metadata: write # the attestation: its storage record
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the bundle against server.json
        run: |
          want=$(python3 -c "import json; print(json.load(open('server.json'))['packages'][0]['fileSha256'])")
          have=$(sha256sum recipe360.mcpb | cut -d' ' -f1)
          test "$want" = "$have" || { echo "recipe360.mcpb does not match server.json"; exit 1; }
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: recipe360.mcpb
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" recipe360.mcpb --title "Recipe360 $GITHUB_REF_NAME" $pre \
            --notes "Connects the Claude desktop app to Recipe360 installed from https://recipe.pulso360.ai. sha256: $(sha256sum recipe360.mcpb | cut -d' ' -f1). Check its origin: gh attestation verify recipe360.mcpb --repo $GITHUB_REPOSITORY"
